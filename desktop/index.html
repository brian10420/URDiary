<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URDiary - 您的情緒日記助手</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- 1. 配置和核心服務 - 優先加載 -->
    <script src="js/config.js"></script>
    <script src="js/error_logger.js"></script>
    <script src="js/api_service.js"></script>
    <script src="js/password_manager.js"></script>
    
    <!-- 2. UI和錯誤處理 -->
    <script src="js/ui_manager.js"></script>
    <script src="js/error_handler.js"></script>
    
    <!-- 3. 功能模塊 - 最後加載 -->
    <script src="js/chat_module.js"></script>
    <script src="js/diary_module.js"></script>
    
    <!-- 主程序入口 - 最後加載 -->
    <script src="js/main.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- 啟動畫面 -->
        <div id="splash-screen" class="splash-screen">
            <div class="splash-content">
                <div class="splash-logo">
                    <img src="assets/icon.jpg" alt="URDiary Logo" onerror="this.src='assets/default-avatar.png'">
                </div>
                <h1>URDiary</h1>
                <p>您的情緒陪伴與日記助手</p>
            </div>
        </div>
        
        <!-- 頁面頂部 -->
        <header class="app-header">
            <div class="app-logo">
                <img src="assets/icon.jpg" alt="URDiary Logo" onerror="this.src='assets/default-avatar.png'">
                <span>URDiary</span>
            </div>
            
            <nav class="app-nav">
                <div class="nav-item active" data-view="chat">對話</div>
                <div class="nav-item" data-view="diary">日記</div>
            </nav>
            
            <div class="app-tools">
                <button id="user-select-btn" class="icon-btn" title="切換用戶">
                    <i class="fa fa-user"></i>
                </button>
                <button id="theme-toggle" class="icon-btn" title="切換主題">
                    <i class="fa fa-sun"></i>
                </button>
                <button id="debug-btn" class="icon-btn" title="開啟調試工具">
                    <i class="fa fa-bug"></i>
                </button>
            </div>
        </header>
        
        <!-- 用戶選擇對話框 -->
        <div id="user-select-dialog" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>選擇用戶</h3>
                    <button id="close-user-dialog-btn" class="btn-close">×</button>
                </div>
                <div class="modal-body">
                    <div id="user-list" class="user-list">
                        <!-- 用戶列表將通過JavaScript動態載入 -->
                        <p>正在載入用戶列表...</p>
                    </div>
                    <div class="user-actions">
                        <button id="create-user-btn" class="btn">創建新用戶</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 密碼驗證對話框 -->
        <div id="password-dialog" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>請輸入密碼</h3>
                    <button id="close-password-dialog-btn" class="btn-close">×</button>
                </div>
                <div class="modal-body">
                    <div id="selected-user-info" class="mb-3"></div>
                    <div class="form-group">
                        <label for="user-password">密碼:</label>
                        <input type="password" id="user-password" class="form-control" placeholder="請輸入4-20位密碼">
                        <div id="password-error" class="error-message" style="display: none; color: red; margin-top: 5px;"></div>
                    </div>
                    <div class="form-actions">
                        <button id="verify-password-btn" class="btn">確認</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 創建用戶對話框 -->
        <div id="create-user-dialog" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>創建新用戶</h3>
                    <button id="close-create-user-btn" class="btn-close">×</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="new-username">用戶名稱:</label>
                        <input type="text" id="new-username" class="form-control" placeholder="請輸入用戶名稱">
                    </div>
                    <div class="form-group">
                        <label for="new-password">密碼:</label>
                        <input type="password" id="new-password" class="form-control" placeholder="請輸入4-20位密碼">
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">確認密碼:</label>
                        <input type="password" id="confirm-password" class="form-control" placeholder="請再次輸入密碼">
                        <div id="create-password-error" class="error-message" style="display: none; color: red; margin-top: 5px;"></div>
                    </div>
                    <div class="form-actions">
                        <button id="submit-new-user" class="btn">創建</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 主內容區域 -->
        <main class="app-content">
            <!-- 對話視圖 -->
            <div id="chat-view" class="view-container active">
                <div class="chat-container">
                    <div class="chat-header">
                        <div class="chat-title">與AI助手對話</div>
                        <div class="chat-actions">
                            <button id="clear-chat-btn" class="btn btn-sm" title="清空對話">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="chat-messages"></div>
                    
                    <div class="chat-input-area">
                        <div class="chat-input-wrapper">
                            <textarea id="user-input" placeholder="告訴我您今天的感受..." autofocus></textarea>
                            <button id="send-button">
                                <i class="fa fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="chat-footer">
                        <button id="end-chat-btn" class="btn">結束對話並生成日記</button>
                    </div>
                </div>
            </div>
            
            <!-- 日記視圖 -->
            <div id="diary-view" class="view-container">
                <h2 class="view-title">日記記錄</h2>
                <div class="diary-container">
                    <div class="diary-list"></div>
                    <div class="diary-detail" style="display: none;">
                        <div class="detail-header">
                            <h3 class="detail-title"></h3>
                            <div class="detail-actions">
                                <button id="back-to-list-btn" class="btn btn-sm">返回列表</button>
                            </div>
                        </div>
                        <div class="detail-content"></div>
                        <div class="detail-footer">
                            <div class="detail-meta">
                                <span class="detail-date"></span>
                                <span class="detail-mood"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- 頁面底部 -->
        <footer class="app-footer">
            <p>URDiary &copy; 2025 - 您的日記助手</p>
        </footer>
    </div>
    
    <!-- 加載動畫 -->
    <div class="loading-spinner">
        <div class="loading-message">生成日記中...</div>
    </div>
    
    <!-- 錯誤提示區域 -->
    <div id="error-container" style="display: none;">
        <div class="error-header">
            <h3>錯誤信息</h3>
            <button id="close-error-btn" class="btn-close">×</button>
        </div>
        <div id="error-content"></div>
    </div>
</body>
</html>
