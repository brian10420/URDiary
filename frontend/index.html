<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心理陪伴筆記系統</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="user-info">
                <div class="user-avatar">U</div>
                <h3 id="username">用戶</h3>
                <p id="user-id">ID: #12345</p>
            </div>
            <ul class="navigation">
                <li><a href="#" class="active" data-view="chat">聊天對話</a></li>
                <li><a href="#" data-view="diary">日記列表</a></li>
                <li><a href="#" data-view="notes">互動筆記</a></li>
            </ul>
        </div>
        <div class="main-content">
            <!-- 聊天界面 -->
            <div class="chat-container" id="chat-view">
                <div class="chat-header">
                    <h2>心理陪伴對話</h2>
                    <p>與 AI 助手開始一段有益的對話</p>
                </div>
                <div class="chat-messages" id="chat-messages">
                    <div class="message assistant-message">
                        你好！我是你的心理陪伴助手。今天你想聊些什麼呢？
                        <div class="message-time">現在</div>
                    </div>
                </div>
                <div class="spinner" id="chat-spinner"></div>
                <div class="chat-input">
                    <input type="text" id="message-input" placeholder="輸入你的訊息...">
                    <button id="send-btn">發送</button>
                </div>
                <button class="end-chat-btn" id="end-chat-btn">結束對話 & 生成日記</button>
            </div>

            <!-- 日記列表界面 -->
            <div class="diary-container" id="diary-view">
                <div class="chat-header">
                    <h2>我的日記</h2>
                    <p>查看您的日記歷史</p>
                </div>
                <div class="spinner" id="diary-spinner"></div>
                <div class="diary-list" id="diary-list">
                    <!-- 日記項目將通過 JavaScript 動態添加 -->
                </div>
                <div class="diary-content" id="diary-content" style="display: none;">
                    <h3 id="diary-content-date">日期</h3>
                    <div id="diary-content-text"></div>
                    <div id="diary-content-emotions">
                        <p>愉悅度: <span id="diary-valence">0.5</span></p>
                        <p>激動度: <span id="diary-arousal">0.5</span></p>
                    </div>
                    <button id="back-to-list-btn" style="margin-top: 15px;">返回列表</button>
                </div>
            </div>

            <!-- 互動筆記界面 -->
            <div class="notes-container" id="notes-view">
                <div class="chat-header">
                    <h2>互動筆記</h2>
                    <p>查看您的交互記錄摘要</p>
                </div>
                <div class="spinner" id="notes-spinner"></div>
                <div class="notes-content" id="notes-content"></div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
