version: "3.8"

services:
  redis:
    image: "redis:latest"
    container_name: "redis-server"
    restart: always
    ports:
      - "6379:6379"

  fastapi:
    build: .
    container_name: "fastapi-app"
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - .env 
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./app:/app
    